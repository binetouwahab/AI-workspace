<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Workspace</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <!-- En-tête -->
    <header class="header">
      <div class="header-logo">
        AI Workspace
      </div>
      <div class="header-user">
        <span>Admin User</span>
        <span class="chevron">⌄</span>
      </div>
    </header>


    <!-- Contenu principal -->
    <div class="workspace">

      <!-- Barre latérale -->
      <aside class="sidebar">

        <nav class="sidebar-menu">

          <button class="menu-button" data-module="accueil">
            Tableau de bord
          </button>

            <button class="menu-button" data-module="chat">
            Chat 
          </button>

            <button class="menu-button" data-module="resume">
            Résume de Texte
          </button>

            <button class="menu-button" data-module="classification">
            Classification
          </button>

          <button class="menu-button" data-module="traduction">
            Traduction
          </button>

          <button class="menu-button" data-module="historique">
            Historique
          </button>

        </nav>

      </aside>


      <!-- Zone principale -->
      <main class="main-content">

        <section class="welcome-section">

          <h1>Tableau de bord</h1>

          <p>
            Bienvenue sur votre espace de travail intelligent 
          </p>

        </section>

      
      </main>

    </div>



    <script src="js/script.js"></script>

  </body>
</html>
